<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu</title>
  <!-- TEMPORARY page for the first slice (scan a QR on a phone).
       The Angular customer app replaces it next. Week 6 style: fetch + DOM. -->
  <style>
    :root { --ink: #1d1d1f; --quiet: #5f6368; --line: #e0e0e0; --accent: #0b6e4f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fafafa; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; color: var(--quiet); }
    main { padding: 8px 16px 32px; max-width: 640px; margin: 0 auto; }
    h2 { font-size: 1.05rem; margin: 24px 0 8px; }
    .dish { display: flex; justify-content: space-between; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 8px; min-height: 44px; }
    .dish h3 { margin: 0; font-size: 1rem; }
    .dish p { margin: 4px 0 0; color: var(--quiet); font-size: 0.9rem; }
    .price { font-weight: 600; white-space: nowrap; }
    .dish.sold-out { opacity: 0.55; }
    .badge { display: inline-block; margin-top: 6px; font-size: 0.8rem; font-weight: 600; color: #8a1c1c; }
    .notice { padding: 24px 16px; text-align: center; color: var(--quiet); }
    .closed { background: #fff4e5; color: #6b4500; padding: 10px 16px; }
  </style>
</head>
<body>
  <header>
    <h1 id="restaurantName">Loading menu…</h1>
    <p id="tableLabel"></p>
  </header>
  <div id="closedBanner" class="closed" hidden>Ordering is unavailable right now.</div>
  <main id="menu" aria-live="polite"></main>

  <script>
    const nameEl = document.querySelector("#restaurantName");
    const tableEl = document.querySelector("#tableLabel");
    const menuEl = document.querySelector("#menu");

    // /t/<qrToken>
    const qrToken = location.pathname.split("/")[2] || "";

    function formatEgp(piastres) {
      return (piastres / 100).toLocaleString("en-EG", { style: "currency", currency: "EGP" });
    }

    // Build elements with textContent (never innerHTML) so menu text can't inject HTML.
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function showError(message) {
      nameEl.textContent = "Menu unavailable";
      tableEl.textContent = "";
      menuEl.replaceChildren(el("p", "notice", message));
    }

    function renderMenu(data) {
      document.title = `${data.restaurant.name} · Table ${data.table.number}`;
      nameEl.textContent = data.restaurant.name;
      tableEl.textContent = `Table ${data.table.number}`;
      document.querySelector("#closedBanner").hidden = data.restaurant.orderingOpen;

      if (data.menu.length === 0) {
        menuEl.replaceChildren(el("p", "notice", "No dishes yet."));
        return;
      }

      const sections = data.menu.map((category) => {
        const section = el("section");
        section.append(el("h2", null, category.name));

        category.items.forEach((item) => {
          const dish = el("article", item.isAvailable ? "dish" : "dish sold-out");
          const info = el("div");
          info.append(el("h3", null, item.name));
          if (item.description) info.append(el("p", null, item.description));
          if (!item.isAvailable) info.append(el("span", "badge", "Sold out"));
          dish.append(info, el("span", "price", formatEgp(item.pricePiastres)));
          section.append(dish);
        });

        return section;
      });

      menuEl.replaceChildren(...sections);
    }

    // Production-safe fetch (Week 6): check response.ok, try/catch, show a clear message.
    async function loadMenu() {
      try {
        const response = await fetch(`/api/public/tables/${encodeURIComponent(qrToken)}`);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }
        renderMenu(data);
      } catch (error) {
        console.error("Failed:", error.message);
        showError(error.message.startsWith("HTTP") ? "Could not load the menu. Please try again." : error.message);
      }
    }

    loadMenu();
  </script>
</body>
</html>
